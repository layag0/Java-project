<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Добавить нового пользователя</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">New User</h2>

    <form th:action="@{/users/new}" th:object="${user}" method="post" class="space-y-4">

        <div>
            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Nickname:</label>
            <input type="text" id="username" th:field="*{username}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label for="hero" class="block text-sm font-medium text-gray-700 mb-1">Favorite Hero:</label>
            <input type="text" id="hero" th:field="*{hero}"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label for="win" class="block text-sm font-medium text-gray-700 mb-1">How much wins:</label>
            <input type="text" id="win" th:field="*{win}" required pattern="[0-9]+"
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="flex items-center justify-between pt-2">
            <a th:href="@{/users}" class="text-sm text-blue-500 hover:underline">Back to leaderboard</a>
            <button type="submit"
                    class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded transition duration-200">
                Save
            </button>
        </div>

    </form>
</div>

</body>
</html>
