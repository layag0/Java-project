<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

<div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-gray-800 text-center">Edit User</h2>

    <form th:action="@{/users/edit}" th:object="${user}" method="post" class="space-y-4">

        <input type="hidden" th:field="*{id}" />

        <div>
            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username:</label>
            <input id="username" th:field="*{username}" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label for="hero" class="block text-sm font-medium text-gray-700 mb-1">Favorite Hero:</label>
            <input id="hero" th:field="*{hero}" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label for="win" class="block text-sm font-medium text-gray-700 mb-1">How much wins:</label>
            <input type="text" id="win" th:field="*{win}" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="flex items-center justify-between pt-4">
            <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-150">
                Save Changes
            </button>
            <a th:href="@{/users}"
               class="text-sm text-gray-600 hover:text-gray-900 underline">
                Cancel
            </a>
        </div>

    </form>
</div>

</body>
</html>
